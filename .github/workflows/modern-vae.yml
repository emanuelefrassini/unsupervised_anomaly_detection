name: Multimodal VAE synthetic validation
on:
  push:
    paths: ['modern_vae/**', '.github/workflows/modern-vae.yml']
  pull_request:
    paths: ['modern_vae/**', '.github/workflows/modern-vae.yml']
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: modern_vae
          submodules: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r modern_vae/requirements.txt
      - run: python -m pytest modern_vae/tests -q
      - run: python -m modern_vae --normal 20 --anomalies 8 --epochs 2 --hidden 8 --output /tmp/vae.json
