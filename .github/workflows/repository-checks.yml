name: Research code static checks
on:
  push:
  pull_request:
jobs:
  data-free-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax and repository metadata (no clinical data)
        run: python -m unittest discover -s tests -p 'test_repository_structure.py' -v
# This workflow intentionally does not claim to train the VAE or reproduce
# paper results. The clinical data and feature-extraction dependencies are absent.
